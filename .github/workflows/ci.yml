name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд — тесты и линтер
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HealthApp-back/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: HealthApp-back/backend/requirements.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Линтер
        run: ruff check .

      - name: Тесты
        env:
          # Тестам не нужны ни реальный SMTP, ни настоящий ключ
          APP_ENV: dev
          SECRET_KEY: ci-secret-key-not-used-in-production-0123456789
        run: python -m pytest

  android:
    name: Android — сборка и unit-тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HealtApp-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Компиляция debug
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Unit-тесты
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: HealtApp-front/app/build/reports/tests/
          if-no-files-found: ignore
