<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <title>Как данные проходят через прототип HealthApp</title>
  <defs><linearGradient id="flowG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10AC84"/><stop offset="100%" stop-color="#2E86DE"/></linearGradient></defs>
  <rect width="1100" height="420" rx="28" fill="#F7FBFA"/>
  <text x="48" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Поток данных</text>
  <text x="48" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#6B7280">Запись на устройстве сохраняется локально и уходит на сервер, когда появляется сеть</text>
  <rect x="40" y="110" width="190" height="120" rx="20" fill="#fff" stroke="#000" stroke-opacity="0.08"/>
  <text x="135" y="158" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1C1C1E">1. Ввод</text>
  <text x="135" y="184" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#4B5563">ручной дневник,</text>
  <text x="135" y="202" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#4B5563">телефон, GPS</text>
  <rect x="250" y="110" width="190" height="120" rx="20" fill="#fff" stroke="#000" stroke-opacity="0.08"/>
  <text x="345" y="158" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1C1C1E">2. Телефон</text>
  <text x="345" y="184" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#4B5563">Room / DataStore,</text>
  <text x="345" y="202" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#4B5563">очередь без сети</text>
  <rect x="460" y="110" width="190" height="120" rx="20" fill="#fff" stroke="#000" stroke-opacity="0.08"/>
  <text x="555" y="158" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1C1C1E">3. API</text>
  <text x="555" y="184" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#4B5563">JWT, REST,</text>
  <text x="555" y="202" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#4B5563">синхронизация</text>
  <rect x="670" y="110" width="190" height="120" rx="20" fill="#fff" stroke="#000" stroke-opacity="0.08"/>
  <text x="765" y="158" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1C1C1E">4. База</text>
  <text x="765" y="184" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#4B5563">PostgreSQL,</text>
  <text x="765" y="202" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#4B5563">история дневника</text>
  <rect x="880" y="110" width="180" height="120" rx="20" fill="url(#flowG)"/>
  <text x="970" y="158" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#fff">5. Ответ</text>
  <text x="970" y="184" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#fff">сводка, цели,</text>
  <text x="970" y="202" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#fff">ИИ-разбор</text>
  <path d="M230 170 H250" stroke="#54A0FF" stroke-width="2.5"/>
  <path d="M440 170 H460" stroke="#54A0FF" stroke-width="2.5"/>
  <path d="M650 170 H670" stroke="#54A0FF" stroke-width="2.5"/>
  <path d="M860 170 H880" stroke="#54A0FF" stroke-width="2.5"/>
  <rect x="40" y="270" width="1020" height="110" rx="22" fill="#fff" stroke="#000" stroke-opacity="0.08"/>
  <text x="64" y="312" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1C1C1E">Защита данных</text>
  <text x="64" y="338" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#4B5563">Пароль хранится в виде хеша. ИИ отвечает только по записям пользователя и не ставит диагноз. Аккаунт и дневник можно удалить из приложения.</text>
  <text x="64" y="360" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#4B5563">Прототип носит информационный характер и не является медицинским изделием.</text>
</svg>
