<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="800" viewBox="0 0 390 800">
  <title>HealthApp AI</title>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10AC84"/><stop offset="100%" stop-color="#2E86DE"/></linearGradient></defs>
  <rect width="390" height="800" rx="40" fill="#0B1C20"/>
  <rect x="12" y="12" width="366" height="776" rx="32" fill="#F2F2F7"/>
  
  <rect x="24" y="56" width="48" height="48" rx="14" fill="url(#g)"/>
  <text x="88" y="76" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#1C1C1E">ИИ-помощник</text>
  <text x="88" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#8E8E93">Только по данным дневника</text>
  <rect x="24" y="128" width="280" height="92" rx="20" fill="#fff"/>
  <text x="40" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1C1C1E">Здравствуйте. Вижу недосып</text>
  <text x="40" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1C1C1E">в среду и мало воды.</text>
  <text x="40" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#8E8E93">не диагноз</text>
  <rect x="86" y="236" width="280" height="64" rx="20" fill="url(#g)"/>
  <text x="106" y="264" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#fff">Разбери сон за 14 дней</text>
  <text x="106" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#fff" opacity="0.85">и свяжи с ужином</text>
  <rect x="24" y="316" width="300" height="118" rx="20" fill="#fff"/>
  <text x="40" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1C1C1E">Средняя длительность 7,1 ч</text>
  <text x="40" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1C1C1E">при цели 8 ч. Самый короткий</text>
  <text x="40" y="386" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1C1C1E">сон - после позднего ужина.</text>
  <text x="40" y="412" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#10AC84">Сместить ужин на 60 минут</text>
  <rect x="24" y="456" width="342" height="72" rx="20" fill="#fff"/>
  <text x="40" y="486" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#8E8E93">Быстрые разборы</text>
  <text x="40" y="508" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1C1C1E">Сон - Питание - Вода</text>
  <rect x="24" y="544" width="342" height="56" rx="18" fill="#fff"/>
  <text x="40" y="578" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#8E8E93">Сообщение по дневнику</text>

  <rect x="12" y="688" width="366" height="100" rx="28" fill="#fff"/>
  <rect x="46" y="706" width="52" height="36" rx="14" fill="url(#g)"/><text x="72" y="760" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#2E86DE">Главная</text><text x="144" y="760" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#8E8E93">Сон</text><text x="196" y="760" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#8E8E93">Питание</text><text x="262" y="760" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#8E8E93">Активность</text><text x="328" y="760" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#8E8E93">Профиль</text>
</svg>
